name: Grevm Tests

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Check out the library without recursively fetching test-only submodules. Cargo consumers
      # follow the same path and must not download the large fixture repository.
      - name: Checkout repository
        uses: actions/checkout@v3

      # `.gitmodules` marks the fixtures with `update = none` so Cargo skips them when Grevm is a
      # Git dependency. This test job opts in explicitly because the replay suites need them.
      - name: Checkout test fixtures
        run: >-
          git -c submodule.test_data.update=checkout
          submodule update --init test_data

      # install rust tools
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      # Compile every feature and target, and reject both rustc and Clippy warnings.
      - name: Run Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # GREVM_MIN_PARALLEL_TXS=0 forces the parallel path for the (often small) replayed mainnet
      # blocks so the parallel-vs-sequential comparison is actually exercised.
      - name: Run tests
        env:
          GREVM_MIN_PARALLEL_TXS: "0"
        run: cargo test --features test-utils
